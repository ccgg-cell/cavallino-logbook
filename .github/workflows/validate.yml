name: Validate Cavallino Logbook
on:
  pull_request:
  push:
    branches: [main, feature/specialist-knowledge-center]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Specialist Center JavaScript syntax
        run: node --check specialist-center.js
      - name: Check Pre-Purchase Inspection JavaScript syntax
        run: node --check prepurchase-inspection.js
      - name: Check inspection photo evidence JavaScript syntax
        run: node --check inspection-photo-evidence.js
      - name: Check service history enhancements JavaScript syntax
        run: node --check service-history-enhancements.js
      - name: Check Ferrari model encyclopedia JavaScript syntax
        run: node --check model-encyclopedia.js
      - name: Check model-specific PPI guidance JavaScript syntax
        run: node --check model-ppi-guidance.js
      - name: Check owner dashboard JavaScript syntax
        run: node --check owner-dashboard.js
      - name: Check maintenance reference register JavaScript syntax
        run: node --check maintenance-reference-register.js
      - name: Check workshop report JavaScript syntax
        run: node --check workshop-report.js
      - name: Run app integration smoke checks
        run: node tests/app-integration.test.js
      - name: Run Pre-Purchase Inspection regression tests
        run: node tests/prepurchase-inspection.test.js
      - name: Run Specialist Center storage regression tests
        run: node tests/specialist-center.test.js
      - name: Validate Specialist Center JSON schema syntax
        run: python -m json.tool specialist-center.schema.json > /dev/null
      - name: Validate Pre-Purchase Inspection schema syntax
        run: python -m json.tool prepurchase-inspection.schema.json > /dev/null
      - name: Check patch whitespace
        run: git diff --check
